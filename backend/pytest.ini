[pytest]
# The backend is a flat module layout (main.py does `from extract import ...`),
# so put the backend dir (rootdir) on sys.path for test imports like
# `from models import ...`. rootdir is the directory of this file.
pythonpath = .
testpaths = tests
# Print a coverage table after every run (pytest-cov). What counts as "our
# code" is set in .coveragerc.
addopts = --cov --cov-report=term-missing:skip-covered
markers =
    slow: takes several seconds (large generated PDFs). Deselect with: pytest -m "not slow"
