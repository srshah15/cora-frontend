# Alembic applies database migrations: numbered scripts that change the
# schema step by step, so every environment ends up with the same tables.
#
#   cd backend
#   alembic upgrade head      # create or update the tables
#
# The database URL is NOT stored here. migrations/env.py reads DATABASE_URL from
# the environment (or backend/.env), the same way the app does.
[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
